spring:
  application:
    name: vendor-mock
  threads:
    virtual:
      enabled: true        # the vendor itself should never be the thread bottleneck — only its latency

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Phase 8: distributed tracing. Off until `make up PHASE=8` sets TRACING_ENABLED=true and starts Tempo.
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # 100%: fine for a lab, far too much for production traffic (see 8.1)
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

quickdrop:
  instance-name: ${INSTANCE_NAME:vendor}
  grafana:
    url: ${GRAFANA_URL:}
