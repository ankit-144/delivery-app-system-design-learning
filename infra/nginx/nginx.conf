# Load balancer in front of the core instances. The upstream list is in /etc/nginx/upstream.conf,
# chosen by CORE_UPSTREAMS (single | round-robin | least-conn) in docker-compose.yml.
worker_processes auto;

events {
    worker_connections 8192;
}

http {
    log_format lb '$remote_addr "$request" status=$status rt=$request_time '
                  'upstream=$upstream_addr urt=$upstream_response_time served_by=$upstream_http_x_served_by';
    access_log /dev/stdout lb;
    error_log /dev/stderr warn;

    # Docker's embedded DNS. Upstream servers marked "resolve" are looked up again every 5 s, so a
    # recreated container (new IP) is found without restarting nginx. Without it nginx resolves names
    # once at startup and keeps sending traffic to dead IPs (we hit exactly that in Phase 5).
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/upstream.conf;

    server {
        listen 80;

        location = /nginx_status {
            stub_status;
            access_log off;
        }

        location / {
            proxy_pass http://core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            # Retry on another instance only when the request never reached the app.
            # POST is not retried unless 'non_idempotent' is added — scenario 3.7 explains why.
            proxy_next_upstream error timeout;
        }
    }
}
