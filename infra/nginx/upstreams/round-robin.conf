# Default nginx balancing: each instance gets the next request in turn, however busy it is.
upstream core {
    zone core 64k;
    server core-1:8080 resolve max_fails=3 fail_timeout=10s;
    server core-2:8080 resolve max_fails=3 fail_timeout=10s;
    server core-3:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
}
