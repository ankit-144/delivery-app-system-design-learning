# Each request goes to the instance with the fewest active connections: a slow instance
# accumulates connections and automatically gets less new traffic (scenario 3.7).
upstream core {
    zone core 64k;
    least_conn;
    server core-1:8080 resolve max_fails=3 fail_timeout=10s;
    server core-2:8080 resolve max_fails=3 fail_timeout=10s;
    server core-3:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
}
