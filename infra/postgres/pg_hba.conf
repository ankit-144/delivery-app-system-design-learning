# Client authentication for the primary. Same as the image's default, plus one line that lets the
# read replica stream the write-ahead log (Phase 5).
local   all          all                 trust
host    all          all   127.0.0.1/32  trust
host    all          all   ::1/128       trust
host    all          all   all           scram-sha-256
host    replication  all   all           scram-sha-256
