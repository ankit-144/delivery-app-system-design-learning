global:
  scrape_interval: 5s        # fine-grained on purpose: scenarios last minutes, not days
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

# Phase 8: firing alerts go to Alertmanager (before Phase 8 it isn't running; Prometheus just logs that it can't reach it).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Every container labelled quickdrop.scrape=true is scraped automatically, so starting core-2
  # (or Redis, or Kafka exporters) needs no config change. Labels in docker-compose.yml decide
  # the port, path and job name.
  - job_name: quickdrop
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["quickdrop.scrape=true"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name, __meta_docker_container_label_quickdrop_metrics_port]
        regex: "/(.+);(.+)"
        replacement: "$1:$2"
        target_label: __address__
      - source_labels: [__meta_docker_container_label_quickdrop_metrics_path]
        target_label: __metrics_path__
      - source_labels: [__meta_docker_container_label_quickdrop_job]
        target_label: job
      - source_labels: [__meta_docker_container_name]
        regex: "/qd-(.+)"
        target_label: instance
    metric_relabel_configs:
      # cAdvisor: keep only QuickDrop containers and give them a short name label.
      - source_labels: [name]
        regex: "qd-(.+)"
        target_label: container
