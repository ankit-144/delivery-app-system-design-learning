# Tempo (Phase 8): stores traces sent by every service over OTLP, and derives metrics from them
# (a service graph and per-span RED metrics) which it remote-writes into Prometheus.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m
  # A trace counts as finished after this long without new spans. Our order traces continue 10–30 s later (outbox
  # relay, Kafka lag, slow vendor); with the 10 s default, the late spans were stored as a separate piece and a
  # search like "root = order AND span = receive" missed half the connected traces until compaction merged them.
  trace_idle_period: 60s

compactor:
  compaction:
    block_retention: 24h          # a lab, not an archive

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
